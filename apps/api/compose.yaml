services:
  mongodb:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongodb-data:
